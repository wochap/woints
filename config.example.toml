# woints — ~/.config/woints/config.toml
# Every key is optional; this file lists the built-in defaults.
# Reload with `woints reload` or `pkill -HUP wointsd`.

[hint]
font         = "Atkinson Hyperlegible Mono" # system family (exact name, else prefix match); embedded font when not installed
font_weight  = 700       # nearest installed weight
size         = 11        # logical px, × output scale, rounded
min_size     = 10
size_unit    = "logical" # or "mm"
size_mm      = 3.0       # used when size_unit = "mm"
padding      = [4, 4]    # [y, x] logical px
radius       = 3
border_width = 1         # device px = max(1, floor(scale))
offset       = [-3, -3]  # from target top-left
gap          = 2         # min space between badges
center_below = 20        # targets smaller than this are centred
uppercase    = true
eliminated   = "hide"    # "hide" | "fade"
prefix_style = "dim-matched" # or "highlight-matched"
outline      = false
outline_width = 1
vision_dash  = [2, 2]
theme        = "auto"    # "auto" (follow the system) | "dark" | "light"

[timing]
appear_ms = 0
fade_ms   = 60
flash_ms  = 80            # hard cap 120
max_showing_ms = 15000    # hide hints after this long without input

[chip]
corner = "bottom-right"
inset  = 12
height = 22

[theme.dark]   # Catppuccin Mocha based; any subset of tokens
hint.bg           = "#a6e3a1"
hint.fg           = "#181825"
hint.fg_dim       = "#585b70"
hint.accent       = "#b4befe"
hint.border       = "#181825"
hint.outline      = "#b4befe"
hint.vision       = "#94e2d5"
hint.flash_bg     = "#fab387"
hint.flash_fg     = "#181825"
hint.drag_bg      = "#fab387"
hint.drag_fg      = "#181825"
hint.scroll       = "#89b4fa"
hint.disabled_bg  = "#313244"
hint.disabled_fg  = "#7f849c"
hint.chip_bg      = "#1e1e2e"
hint.chip_fg      = "#cdd6f4"
hint.chip_border  = "#cdd6f4"
hint.chip_accent  = "#b4befe"

[theme.light]   # Catppuccin Latte based; any subset of tokens
hint.bg           = "#40a02b"
hint.fg           = "#e6e9ef"
hint.fg_dim       = "#acb0be"
hint.accent       = "#7287fd"
hint.border       = "#e6e9ef"
hint.outline      = "#7287fd"
hint.vision       = "#179299"
hint.flash_bg     = "#fe640b"
hint.flash_fg     = "#11111b"
hint.drag_bg      = "#fe640b"
hint.drag_fg      = "#11111b"
hint.scroll       = "#1e66f5"
hint.disabled_bg  = "#ccd0da"
hint.disabled_fg  = "#5c5f77"
hint.chip_bg      = "#eff1f5"
hint.chip_fg      = "#4c4f69"
hint.chip_border  = "#4c4f69"
hint.chip_accent  = "#8839ef"

[keys]
# "auto": label glyphs are what your layout types on the home-row keys
# (Colemak-DH shows arstneio). "explicit": use `alphabet` as written.
# Keys always match by physical keycode.
mode     = "auto"
alphabet = "asdfghjkl"
exclude  = []

[scope]
default       = "focused"   # "focused" | "focused+layers" | "layers" | "all"
levels        = ["bottom", "top", "overlay"]  # layer-shell levels hinted
ignore_layers = ["awww-daemon", "wayland-pipewire-idle-inhibit"]

[vision]
mode               = "auto"  # "auto" | "always" | "off"
min_atspi_elements = 3       # fewer usable AT-SPI elements triggers vision
force_classes      = []      # class globs that always get vision
budget_ms          = 250
max_elements       = 150
detector           = "classical"  # "classical" | "onnx" | "onnx+classical" (onnx needs a woints-onnx build)

[vision.onnx]
model_path     = ""           # e.g. "~/.local/share/woints/models/ui.onnx"; no model is bundled
ep             = "cpu"        # "cpu" | "cuda" | "migraphx"
threads        = 0            # 0 = physical cores / 2
min_confidence = 0.35
nms_iou        = 0.5

[merge]
iou_threshold         = 0.3  # vision box dropped above this IoU with an AT-SPI box
containment_threshold = 0.9

[input]
pointer        = "movecursor" # "movecursor" | "absolute" | "none"
prefer         = "action"     # "action" (AT-SPI first) | "pointer"
restore_cursor = true
double_click_gap_ms = 40
drag_steps     = 8
scroll_step    = 3
unmap_timeout_ms = 200
modifiers      = { shift = "right", ctrl = "middle", alt = "hover", super = "none" }
keys           = "auto"       # "auto" (Hyprland submap if the module is loaded, else overlay) | "submap" | "overlay"
submap         = "woints-keys" # must match setup({ submap = ... }) of the Hyprland module

[actions]
default = "click"

[providers.quickshell]
mode      = "auto"  # "auto" | "off"
budget_ms = 250  # one `qs ipc call` fork takes 50–100 ms; killed on overrun
ignore_configs = []  # config_path globs of instances to skip, e.g. ["*/lock.qml"]

[apps]
disabled_classes     = []  # class globs never hinted
force_vision_classes = []  # class globs that always get vision

[a11y]
# Chromium and Electron apps keep their accessibility tree off until asked.
# Woints wakes it on the first request (one-time pause of up to 1 s per app);
# a woken browser uses about 20 MB more memory for as long as it runs.
wake_chromium = true  # wake dormant Chromium/Electron accessibility trees
wake_exclude  = []    # class globs never woken (case-insensitive); they get vision
