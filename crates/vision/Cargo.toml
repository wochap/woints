[package]
name = "woints-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
woints-core.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }

[features]
default = []
onnx = ["dep:ort"]
cuda = ["onnx", "ort/cuda"]
migraphx = ["onnx", "ort/migraphx"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
